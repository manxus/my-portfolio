<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build Verified — QA Game Tester Portfolio" />
    <meta name="theme-color" content="#0a0f12" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@300;400;500;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <title>Build Verified</title>

    <!--
      A tab restored from the browser cache can carry an index.html from an
      earlier deploy, whose hashed /assets/ files no longer exist. Reload once
      to pick up the current build instead of rendering a black page. Inline so
      it also covers the entry chunk itself failing to load.
    -->
    <script>
      (function () {
        var KEY = 'bv_stale_reload';
        function reloadOnce() {
          try {
            var last = Number(sessionStorage.getItem(KEY));
            if (last && Date.now() - last < 10000) return false;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {
            // Without storage there is no way to stop a reload loop.
            return false;
          }
          location.reload();
          return true;
        }
        // A lazy page chunk (or its CSS) failed to load.
        window.addEventListener('vite:preloadError', function (event) {
          if (reloadOnce()) event.preventDefault();
        });
        // The entry script, its stylesheet or a modulepreload 404'd.
        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            var url = el && (el.src || el.href);
            if (
              (el.tagName === 'SCRIPT' || el.tagName === 'LINK') &&
              url && url.indexOf(location.origin + '/assets/') === 0
            ) {
              reloadOnce();
            }
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="admin-portal"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
