name: Sync Counter-Strike 2 Data

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No --icons: the weapon and map art is downloaded once locally and committed, so CI only
      # refreshes the counters.
      - name: Fetch Counter-Strike 2 stats
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/fetch-cs2-data.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/counterstrike.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync counter-strike data"
            git push
          else
            echo "No changes to counterstrike.json, skipping commit."
          fi
