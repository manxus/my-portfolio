name: Sync Satisfactory Data

on:
  schedule:
    # Staggered against the other game syncs so they never contend for the same API key.
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Satisfactory stats
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/fetch-satisfactory-data.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/satisfactory.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync satisfactory data"
            git push
          else
            echo "No changes to satisfactory.json, skipping commit."
          fi
