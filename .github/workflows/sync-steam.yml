name: Sync Steam Data

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  # GitHub cron only speaks UTC, so both candidate hours fire and this keeps the one that is
  # midnight in Stockholm: 22:00 UTC in summer time, 23:00 UTC in winter time. The offset is
  # read for the evening of the run, which the 01:00 UTC switch never splits.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE:$(TZ=Europe/Stockholm date +%z)" in
            :*|'0 22 * * *:+0200'|'0 23 * * *:+0100') echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Not midnight in Stockholm, skipping." ;;
          esac

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/cache@v5
        id: steam-cache
        with:
          path: scripts/.steam-fetch-cache
          # The run id keeps the primary key unique per run. actions/cache skips
          # saving on an exact key hit, so a static key froze the store cache at
          # whatever it held on its first run and never grew again.
          key: steam-fetch-v2-${{ hashFiles('scripts/fetch-steam-data.js') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            steam-fetch-v2-${{ hashFiles('scripts/fetch-steam-data.js') }}-
            steam-fetch-v2-
            steam-fetch-v1-

      - name: Fetch Steam data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/fetch-steam-data.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/steam-library.json src/data/steam-changes.json src/data/steam-achievement-baselines.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync steam library data"
            git push
          else
            echo "No changes to steam data, skipping commit."
          fi
