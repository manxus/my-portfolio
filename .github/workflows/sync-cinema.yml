name: Sync Cinema Shows

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  # GitHub cron only speaks UTC, so both candidate hours fire and this keeps the one that is
  # midnight in Stockholm: 22:00 UTC in summer time, 23:00 UTC in winter time. The offset is
  # read for the evening of the run, which the 01:00 UTC switch never splits.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE:$(TZ=Europe/Stockholm date +%z)" in
            :*|'0 22 * * *:+0200'|'0 23 * * *:+0100') echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Not midnight in Stockholm, skipping." ;;
          esac

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Refresh show seasons from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/refresh-cinema-shows.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cinema.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync cinema show data"
            git push
          else
            echo "No changes to cinema.json, skipping commit."
          fi
