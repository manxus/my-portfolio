name: Sync Cinema Shows

# Weekly rather than nightly: a show gains a season a few times a year, and the
# run costs one TMDB call per tracked show.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh show seasons from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/refresh-cinema-shows.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/cinema.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync cinema show data"
            git push
          else
            echo "No changes to cinema.json, skipping commit."
          fi
