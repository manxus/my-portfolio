# Replace YOUR_GITHUB_USERNAME/YOUR_REPO_NAME and YOUR_PRODUCTION_DOMAIN before deploy.
# GitHub OAuth callback URL: https://YOUR_PRODUCTION_DOMAIN/api/complete

backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPO_NAME
  branch: main
  base_url: https://YOUR_PRODUCTION_DOMAIN
  auth_endpoint: api/begin

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: site_data
    label: Site data (JSON)
    files:
      - label: QA Portfolio
        name: qa_portfolio
        file: src/data/qaPortfolio.json
        fields:
          - label: Education
            name: education
            widget: list
            summary: "{{fields.degree}}"
            fields:
              - { label: Degree, name: degree, widget: string }
              - { label: Institution, name: institution, widget: string }
              - { label: Period, name: period, widget: string }
              - { label: Description, name: description, widget: text }
          - label: Experience
            name: experience
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Company, name: company, widget: string }
              - { label: Period, name: period, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Highlights
                name: highlights
                widget: list
          - label: Playtests
            name: playtests
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Studio, name: studio, widget: string }
              - { label: Year, name: year, widget: string }
              - { label: Type, name: type, widget: string }
              - { label: Store or page URL, name: url, widget: string, required: false }
          - label: Certificates
            name: certificates
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Issuer, name: issuer, widget: string }
              - { label: Year, name: year, widget: string }

      - label: Media
        name: media
        file: src/data/media.json
        fields:
          - label: Categories
            name: categories
            widget: list
          - label: Gallery items
            name: galleryItems
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: ID, name: id, widget: number, value_type: int }
              - { label: Type, name: type, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Thumbnail URL, name: thumbnail, widget: string }
              - { label: Full URL, name: fullUrl, widget: string, required: false }
              - { label: Video URL, name: videoUrl, widget: string, required: false }

      - label: Livestream
        name: livestream
        file: src/data/livestream.json
        fields:
          - { label: Twitch channel, name: twitchChannel, widget: string }
          - { label: Timezone note, name: timezone, widget: string, required: false }
          - { label: Schedule note, name: scheduleNote, widget: text }
          - label: About
            name: about
            widget: object
            fields:
              - { label: Intro, name: intro, widget: text }
              - { label: QA streams note, name: qaStreamsNote, widget: text }
          - label: Schedule
            name: schedule
            widget: list
            summary: "{{fields.day}}"
            fields:
              - { label: Day, name: day, widget: string }
              - { label: Time, name: time, widget: string }
              - { label: Game, name: game, widget: string }
          - label: Highlights
            name: highlights
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: ID, name: id, widget: number }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Thumbnail URL, name: thumbnail, widget: string, required: false }
              - { label: Video URL, name: videoUrl, widget: string, required: false }
          - label: Stream loadout
            name: streamLoadout
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Value, name: value, widget: string }
              - { label: Link URL, name: url, widget: string, required: false }
          - label: Chat rules
            name: chatRules
            widget: list
            summary: "{{fields.text}}"
            fields:
              - { label: Rule, name: text, widget: string }
          - label: Chat commands
            name: chatCommands
            widget: list
            summary: "{{fields.command}}"
            fields:
              - { label: Command, name: command, widget: string }
              - { label: Description, name: description, widget: string }

      - label: Journey
        name: travel
        file: src/data/travel.json
        fields:
          - label: Home base
            name: home
            widget: object
            fields:
              - { label: Location, name: location, widget: string }
              - { label: Latitude, name: lat, widget: number, value_type: float }
              - { label: Longitude, name: lng, widget: number, value_type: float }
          - label: Trips
            name: trips
            widget: list
            summary: "{{fields.location}}"
            fields:
              - { label: ID, name: id, widget: number, value_type: int }
              - { label: Location, name: location, widget: string }
              - { label: Latitude, name: lat, widget: number, value_type: float }
              - { label: Longitude, name: lng, widget: number, value_type: float }
              - { label: Period, name: period, widget: string }
              - { label: Summary, name: summary, widget: text, required: false }
              - label: Highlights
                name: highlights
                widget: list
              - { label: Cover URL, name: coverUrl, widget: string, required: false }
              - label: Photos
                name: photos
                widget: list
                required: false
                summary: "{{fields.caption}}"
                fields:
                  - { label: Image URL, name: url, widget: string }
                  - { label: Caption, name: caption, widget: string, required: false }
              - { label: Video URL, name: videoUrl, widget: string, required: false }

      - label: Music
        name: music
        file: src/data/music.json
        fields:
          - label: Favorites
            name: favorites
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: ID, name: id, widget: number }
              - label: Kind
                name: kind
                widget: select
                options: [Album, Artist]
              - { label: Title, name: title, widget: string }
              - { label: Artist, name: artist, widget: string, required: false }
              - { label: Show in favorite albums, name: featured, widget: boolean, required: false }
              - label: Physical copy
                name: physicalFormat
                widget: select
                options: [Vinyl, CD, Cassette]
                required: false
              - { label: Description, name: description, widget: text, required: false }
              - { label: Cover URL, name: coverUrl, widget: string, required: false }
              - { label: Listen URL, name: listenUrl, widget: string, required: false }
          - label: Performances
            name: performances
            widget: list
            summary: "{{fields.artist}} · {{fields.date}}"
            fields:
              - { label: ID, name: id, widget: number }
              - { label: Artist, name: artist, widget: string }
              - { label: Date, name: date, widget: string }
              - { label: Venue, name: venue, widget: string }
              - { label: City, name: city, widget: string }
              - { label: Tour / Festival, name: tourFestival, widget: string, required: false }
              - { label: Cover URL, name: coverUrl, widget: string, required: false }
              - { label: Listen URL, name: listenUrl, widget: string, required: false }

      - label: Library
        name: books
        file: src/data/books.json
        fields:
          - label: Books
            name: books
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: ID, name: id, widget: number, value_type: int }
              - { label: Title, name: title, widget: string }
              - { label: Author, name: author, widget: string }
              - { label: Have read, name: read, widget: boolean, required: false }
              - { label: Show in favorites, name: featured, widget: boolean, required: false }
              - label: Format
                name: format
                widget: select
                options: [Paperback, Hardcover, Ebook, Audiobook]
                required: false
              - { label: Description, name: description, widget: text, required: false }
              - { label: Cover URL, name: coverUrl, widget: string, required: false }
              - { label: Read URL, name: readUrl, widget: string, required: false }

      - label: Tabletop
        name: tabletop
        file: src/data/tabletop.json
        fields:
          - label: Games
            name: games
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: ID, name: id, widget: number, value_type: int }
              - { label: Title, name: title, widget: string }
              - { label: Designer, name: designer, widget: string }
              - { label: Show in favorites, name: featured, widget: boolean, required: false }
              - { label: Owned (physical shelf), name: owned, widget: boolean, required: false }
              - { label: Wishlist, name: wishlist, widget: boolean, required: false }
              - { label: Wins, name: wins, widget: number, value_type: int, required: false }
              - { label: Losses, name: losses, widget: number, value_type: int, required: false }
              - { label: Player count, name: playerCount, widget: string, required: false }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Cover URL, name: coverUrl, widget: string, required: false }
              - { label: BGG URL, name: bggUrl, widget: string, required: false }

      - label: Credits
        name: credits
        file: src/data/credits.json
        fields:
          - label: Credits
            name: credits
            widget: list
            summary: "{{fields.heading}}"
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Items
                name: items
                widget: list

      - label: Patch notes (known issues)
        name: patch_notes
        file: src/data/patchNotes.json
        fields:
          - label: Known issues
            name: knownIssues
            widget: list

      - label: Main menu
        name: menu
        file: src/data/menu.json
        fields:
          - label: Menu items
            name: menuItems
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Path, name: path, widget: string, required: false }
              - { label: Action, name: action, widget: string, required: false }
              - label: Children
                name: children
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Path, name: path, widget: string }
                  - { label: Description, name: description, widget: text }

      - label: Steam reviews
        name: steam_reviews
        file: src/data/steam-reviews.json
        fields:
          - label: Reviews
            name: reviews
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Steam App ID, name: appId, widget: number, value_type: int }
              - { label: Game name (optional, if not in library), name: gameName, widget: string, required: false }
              - { label: Rating 1-10, name: rating, widget: number, value_type: int }
              - { label: Title, name: title, widget: string }
              - { label: Text, name: text, widget: text }
              - { label: Date, name: date, widget: string }
              - { label: Recommended, name: recommended, widget: boolean }
              - label: Pros
                name: pros
                widget: list
              - label: Cons
                name: cons
                widget: list

      - label: References
        name: references
        file: src/data/references.json
        fields:
          - label: References
            name: references
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Company, name: company, widget: string }
              - { label: Relationship, name: relationship, widget: string }
              - { label: Quote, name: quote, widget: text, required: false }
              - { label: Available, name: available, widget: boolean }

      - label: Changelog
        name: changelog
        file: src/data/changelog.json
        fields:
          - label: Changelog
            name: changelog
            widget: list
            summary: "{{fields.version}}"
            fields:
              - { label: Version, name: version, widget: string }
              - { label: Date, name: date, widget: string }
              - label: Entries
                name: entries
                widget: list
                summary: "{{fields.text}}"
                fields:
                  - { label: Type, name: type, widget: select, options: [added, fixed, changed, removed] }
                  - { label: Text, name: text, widget: string }

      - label: Resume
        name: resume
        file: src/data/resume.json
        fields:
          - label: Personal info
            name: personalInfo
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Location, name: location, widget: string }
              - { label: Email, name: email, widget: string }
              - label: Availability
                name: availability
                widget: object
                fields:
                  - { label: Show availability badge, name: enabled, widget: boolean, default: true }
                  - label: Status
                    name: status
                    widget: select
                    options: [open, limited, busy, hidden]
                    default: open
                  - { label: Custom label (optional), name: label, widget: string }
                  - { label: Note (optional), name: note, widget: string }
              - label: Links
                name: links
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }
          - label: Timeline
            name: timeline
            widget: list
            summary: "{{fields.year}}"
            fields:
              - { label: Year, name: year, widget: string }
              - label: Entries
                name: entries
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Type, name: type, widget: select, options: [work, volunteer, cert, education] }
                  - { label: Title, name: title, widget: string }
                  - { label: Organization, name: org, widget: string }
                  - { label: Period, name: period, widget: string }
                  - { label: Description, name: description, widget: text }

      - label: Tech
        name: tech
        file: src/data/tech.json
        fields:
          - label: Categories
            name: techCategories
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Title, name: title, widget: string }
              - label: Items
                name: items
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: Name, name: name, widget: string }
                  - label: Tags
                    name: tags
                    widget: list
                  - { label: Proficiency, name: proficiency, widget: string, required: false }
                  # Quantity: use for Component Inventory (category id "component-inventory"); optional elsewhere.
                  - { label: Quantity, name: quantity, widget: number, required: false, value_type: int }
                  # Component fields below: use for Computer Builds (category id "builds"); optional elsewhere.
                  - { label: CPU, name: cpu, widget: string, required: false }
                  - { label: GPU, name: gpu, widget: string, required: false }
                  - { label: RAM, name: ram, widget: string, required: false }
                  - { label: Storage, name: storage, widget: string, required: false }
                  - { label: Motherboard, name: motherboard, widget: string, required: false }
                  - { label: PSU, name: psu, widget: string, required: false }
                  - { label: Case, name: case, widget: string, required: false }
                  - { label: Cooling, name: cooling, widget: string, required: false }
                  - { label: Other / Notes, name: extras, widget: text, required: false }
                  - { label: Free-form specs (legacy), name: specs, widget: text, required: false }
